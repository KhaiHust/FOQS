version: '3.8'

services:
  mysql-shard-0:
    image: mysql:8.0
    container_name: foqs-mysql-shard-0
    cpus: 2
    mem_limit: 3g
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3g
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: foqs_shard_0
    ports:
      - "3306:3306"
    command: >-
      --default-authentication-plugin=mysql_native_password
      --skip-log-bin
      --innodb-buffer-pool-size=${INNODB_BUFFER_POOL_SIZE:-2147483648}
      --innodb-flush-log-at-trx-commit=2
      --innodb-io-capacity=2000
      --innodb-io-capacity-max=4000
      --innodb-log-file-size=1073741824
      --innodb-flush-method=O_DIRECT
      --max-connections=200
      --performance-schema=OFF
      --table-open-cache=4000
    volumes:
      - foqs-shard-0-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  mysql-shard-1:
    image: mysql:8.0
    container_name: foqs-mysql-shard-1
    cpus: 2
    mem_limit: 3g
