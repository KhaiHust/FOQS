version: '3.8'

services:
  mysql-bench:
    image: mysql:8.0
    container_name: foqs-mysql-bench
    cpus: 4
    mem_limit: 8g
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8g
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: foqs_shard_0
    ports:
      - "3306:3306"
    volumes:
      - foqs-bench-data:/var/lib/mysql
    command: >-
      --default-authentication-plugin=mysql_native_password
      --skip-log-bin
      --innodb-buffer-pool-size=${INNODB_BUFFER_POOL_SIZE:-4294967296}
      --innodb-flush-log-at-trx-commit=2
      --innodb-io-capacity=2000
      --innodb-io-capacity-max=4000
      --innodb-log-file-size=1073741824
      --innodb-flush-method=O_DIRECT
      --max-connections=200
      --performance-schema=OFF
      --table-open-cache=4000
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  foqs-bench-data:
    name: foqs-bench-data
