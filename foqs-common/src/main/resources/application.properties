# Active profile fallback (default: local)
foqs.profile=local

# Shard Definitions (3 Shards)
foqs.shards.count=3
foqs.shards.0.url=jdbc:mysql://localhost:3306/foqs_shard_0?useSSL=false&allowPublicKeyRetrieval=true
foqs.shards.0.username=root
foqs.shards.0.password=root

foqs.shards.1.url=jdbc:mysql://localhost:3307/foqs_shard_1?useSSL=false&allowPublicKeyRetrieval=true
foqs.shards.1.username=root
foqs.shards.1.password=root

foqs.shards.2.url=jdbc:mysql://localhost:3308/foqs_shard_2?useSSL=false&allowPublicKeyRetrieval=true
foqs.shards.2.username=root
foqs.shards.2.password=root

# Hikari Connection Pool Settings
foqs.datasource.max-pool-size=20
foqs.datasource.min-idle=5
foqs.datasource.idle-timeout-ms=30000
foqs.datasource.connection-timeout-ms=2000